<!DOCTYPE html>
<html lang="en" data-theme="crimson">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minh Hy — Backend Engineer</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="profile-stack" aria-label="Developer Profile">
        <!-- Crossfading Hero Frame (both SVGs pre-mounted for 0ms silky dissolve) -->
        <div class="hero-frame crossfade-box">
          <img class="layer layer-crimson" src="./assets/hero-crimson.svg" alt="Minh Hy — Backend Engineer (Crimson)" />
          <img class="layer layer-mono" src="./assets/hero.svg" alt="Minh Hy — Backend Engineer (Monochrome)" />

          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" title="Switch Theme (Shortcut: T)">
            <span class="toggle-dot" aria-hidden="true"></span>
            <span id="toggle-label">monochrome</span>
          </button>
        </div>

        <!-- Crossfading Contact Row -->
        <nav class="contact-row" aria-label="Contact links">
          <a class="pill-link crossfade-box" href="https://www.linkedin.com/in/minh-hy-ph%E1%BA%A1m-bb28a5202/" target="_blank" rel="noreferrer">
            <img class="layer layer-crimson" src="./assets/btn-linkedin-crimson.svg" alt="LinkedIn — Minh Hy" />
            <img class="layer layer-mono" src="./assets/btn-linkedin.svg" alt="LinkedIn — Minh Hy" />
          </a>
          <a class="pill-link crossfade-box" href="mailto:minhhy191@gmail.com">
            <img class="layer layer-crimson" src="./assets/btn-email-crimson.svg" alt="Email — minhhy191@gmail.com" />
            <img class="layer layer-mono" src="./assets/btn-email.svg" alt="Email — minhhy191@gmail.com" />
          </a>
        </nav>

        <p class="bio">
          <strong>Backend Engineer</strong> crafting reliable APIs, clean architecture, and scalable systems for modern products.
        </p>

        <!-- Crossfading Divider -->
        <div class="divider-frame crossfade-box" aria-hidden="true">
          <img class="layer layer-crimson" src="./assets/divider-crimson.svg" alt="" />
          <img class="layer layer-mono" src="./assets/divider.svg" alt="" />
        </div>

        <!-- Crossfading Bento Grid -->
        <div class="bento-frame crossfade-box">
          <img class="layer layer-crimson" src="./assets/bento-crimson.svg" alt="Backend Capabilities" />
          <img class="layer layer-mono" src="./assets/bento.svg" alt="Backend Capabilities" />
        </div>

        <!-- Crossfading Tech Stack -->
        <div class="tech-stack-wrap">
          <div id="stack-crimson" class="tech-stack stack-layer layer-crimson" aria-label="Tech Stack"></div>
          <div id="stack-mono" class="tech-stack stack-layer layer-mono" aria-label="Tech Stack"></div>
        </div>

        <p class="footer-note">
          Available for freelance &amp; outsource collaboration worldwide ·
          <a class="subtle-gh-link" href="https://github.com/minhhy19" target="_blank" rel="noreferrer">github.com/minhhy19</a>
        </p>
      </section>
    </main>

    <script src="./src/app.js" defer></script>
  </body>
</html>
