<!DOCTYPE html>
<html lang="en" data-theme="monochrome">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minh Hy — Backend Engineer</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>Minh Hy · Backend Engineer</span>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span class="toggle-swatch" aria-hidden="true"></span>
          <span id="toggle-label">Monochrome · B&amp;W</span>
          <span id="toggle-hint" class="toggle-hint">Switch to Red &amp; Black</span>
        </button>
      </header>

      <section class="profile-stack" aria-label="Developer Profile">
        <div class="hero-frame">
          <img id="img-hero" src="./assets/hero.svg" alt="Minh Hy — Backend Engineer" />
        </div>

        <nav class="contact-row" aria-label="Contact links">
          <a href="https://www.linkedin.com/in/minh-hy-ph%E1%BA%A1m-bb28a5202/" target="_blank" rel="noreferrer">
            <img id="img-linkedin" src="./assets/btn-linkedin.svg" alt="LinkedIn — Minh Hy" />
          </a>
          <a href="mailto:minhhy191@gmail.com">
            <img id="img-email" src="./assets/btn-email.svg" alt="Email — minhhy191@gmail.com" />
          </a>
        </nav>

        <p class="bio">
          <strong>Backend Engineer</strong> crafting reliable APIs, clean architecture, and scalable systems for modern products.
        </p>

        <div class="divider-frame" aria-hidden="true">
          <img id="img-divider" src="./assets/divider.svg" alt="" />
        </div>

        <div class="bento-frame">
          <img id="img-bento" src="./assets/bento.svg" alt="Backend Capabilities" />
        </div>

        <div id="tech-stack" class="tech-stack" aria-label="Tech Stack"></div>

        <p class="footer-note">Available for freelance &amp; outsource collaboration worldwide.</p>
      </section>
    </main>

    <script src="./src/app.js" defer></script>
  </body>
</html>
