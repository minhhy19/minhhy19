<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 44" width="192" height="44" role="img" aria-label="LinkedIn — Minh Hy">
  <defs>
    <style>
      .btn-sheen { opacity: 0; animation: btnSweep 7s ease-in-out infinite; }
      @keyframes btnSweep {
        0%   { transform: translateX(-70px); opacity: 0; }
        15%  { opacity: 1; }
        38%  { transform: translateX(235px); opacity: 0; }
        100% { transform: translateX(235px); opacity: 0; }
      }
    </style>
    <linearGradient id="liBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D213F" />
      <stop offset="100%" stop-color="#0A1428" />
    </linearGradient>
    <linearGradient id="liBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="liSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="liClip">
      <rect x="1" y="1" width="190" height="42" rx="21" />
    </clipPath>
  </defs>

  <g clip-path="url(#liClip)">
    <rect x="0" y="0" width="192" height="44" fill="url(#liBg)" />
    <g class="btn-sheen" opacity="0">
      <polygon points="0,0 42,0 24,44 -18,44" fill="url(#liSheen)" />
    </g>

    <!-- LinkedIn emblem -->
    <rect x="13" y="11" width="22" height="22" rx="6" fill="#0A66C2" />
    <circle cx="19.5" cy="17.5" r="1.4" fill="#FFFFFF" />
    <rect x="18.3" y="20.2" width="2.4" height="7.6" rx="0.6" fill="#FFFFFF" />
    <path d="M 22.8 20.2 L 25.1 20.2 L 25.1 21.4 C 25.7 20.5 26.6 20 27.8 20 C 29.7 20 30.6 21.2 30.6 23.3 L 30.6 27.8 L 28.2 27.8 L 28.2 23.8 C 28.2 22.6 27.7 22 26.8 22 C 25.8 22 25.2 22.7 25.2 23.8 L 25.2 27.8 L 22.8 27.8 Z" fill="#FFFFFF" />

    <text x="45" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
      <tspan fill="#F8FAFC" font-weight="600">LinkedIn</tspan>
      <tspan dx="5" fill="#475569">·</tspan>
      <tspan dx="5" fill="#7DD3FC" font-weight="500">Minh Hy</tspan>
    </text>
  </g>
  <rect x="1" y="1" width="190" height="42" rx="21" fill="none" stroke="url(#liBorder)" stroke-width="1.2" />
</svg>
