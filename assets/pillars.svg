<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 132" width="900" height="132" role="img" aria-label="Core Focus: APIs &amp; Architecture, Data &amp; Performance, Production Delivery">
  <defs>
    <style>
      .pulse-dot { animation: softPulse 3.2s ease-in-out infinite; }
      .pulse-dot-2 { animation: softPulse 3.2s ease-in-out -1.1s infinite; }
      .pulse-dot-3 { animation: softPulse 3.2s ease-in-out -2.2s infinite; }
      .wave-draw {
        stroke-dasharray: 44;
        animation: drawWave 4.2s ease-in-out infinite;
      }
      .mini-spin {
        animation: miniSpin 12s linear infinite;
        transform-origin: 652px 44px;
      }
      @keyframes softPulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
      @keyframes drawWave {
        0%, 100% { stroke-dashoffset: 0; }
        50%      { stroke-dashoffset: 18; }
      }
      @keyframes miniSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1426" />
      <stop offset="100%" stop-color="#090E1B" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ==================== CARD 1: APIs & Architecture ==================== -->
  <g>
    <rect x="1" y="6" width="286" height="120" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="44" y="6" width="200" height="2" rx="1" fill="url(#accentCyan)" />

    <!-- Icon container -->
    <rect x="22" y="26" width="36" height="36" rx="10" fill="#38BDF8" fill-opacity="0.11" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1" />
    <!-- Minimal node-link icon -->
    <circle cx="33" cy="44" r="3" fill="#38BDF8" />
    <circle class="pulse-dot" cx="47" cy="37" r="2.6" fill="#7DD3FC" />
    <circle class="pulse-dot-2" cx="47" cy="51" r="2.6" fill="#818CF8" />
    <line x1="36" y1="42.8" x2="44.5" y2="38.2" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" />
    <line x1="36" y1="45.2" x2="44.5" y2="49.8" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" />

    <text x="70" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">APIs &amp; Architecture</text>
    <text x="70" y="59" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Clean &amp; Resilient</text>

    <text x="22" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Reliable services &amp; clear system design.</text>
    <text x="22" y="108" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Thiết kế API và kiến trúc dễ mở rộng.</text>
  </g>

  <!-- ==================== CARD 2: Data & Performance ==================== -->
  <g>
    <rect x="307" y="6" width="286" height="120" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="350" y="6" width="200" height="2" rx="1" fill="url(#accentIndigo)" />

    <!-- Icon container -->
    <rect x="328" y="26" width="36" height="36" rx="10" fill="#A855F7" fill-opacity="0.11" stroke="#A855F7" stroke-opacity="0.32" stroke-width="1" />
    <!-- Animated waveform icon -->
    <path class="wave-draw" d="M 335 46 L 340 46 L 343.5 37 L 348.5 51 L 352 42 L 357 42" fill="none" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <text x="376" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Data &amp; Performance</text>
    <text x="376" y="59" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Fast &amp; Scalable</text>

    <text x="328" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Database modeling, caching &amp; tuning.</text>
    <text x="328" y="108" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Tối ưu cơ sở dữ liệu, cache &amp; hiệu năng.</text>
  </g>

  <!-- ==================== CARD 3: Production Delivery ==================== -->
  <g>
    <rect x="613" y="6" width="286" height="120" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="656" y="6" width="200" height="2" rx="1" fill="url(#accentEmerald)" />

    <!-- Icon container -->
    <rect x="634" y="26" width="36" height="36" rx="10" fill="#34D399" fill-opacity="0.11" stroke="#34D399" stroke-opacity="0.32" stroke-width="1" />
    <!-- Animated orbital deploy icon -->
    <circle class="mini-spin" cx="652" cy="44" r="9" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="16 8" stroke-linecap="round" />
    <circle class="pulse-dot-3" cx="652" cy="44" r="3" fill="#6EE7B7" />

    <text x="682" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Production Delivery</text>
    <text x="682" y="59" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Smooth Handoff</text>

    <text x="634" y="88" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Docker, CI/CD &amp; maintainable delivery.</text>
    <text x="634" y="108" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Triển khai thực tế &amp; bàn giao chỉn chu.</text>
  </g>
</svg>
