<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 44" width="218" height="44" role="img" aria-label="Email — minhhy191@gmail.com">
  <defs>
    <style>
      .btn-sheen { opacity: 0; animation: btnSweep 7s ease-in-out -3.5s infinite; }
      @keyframes btnSweep {
        0%   { transform: translateX(-70px); opacity: 0; }
        15%  { opacity: 1; }
        38%  { transform: translateX(265px); opacity: 0; }
        100% { transform: translateX(265px); opacity: 0; }
      }
    </style>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171632" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="emBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="emSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="emClip">
      <rect x="1" y="1" width="216" height="42" rx="21" />
    </clipPath>
  </defs>

  <g clip-path="url(#emClip)">
    <rect x="0" y="0" width="218" height="44" fill="url(#emBg)" />
    <g class="btn-sheen" opacity="0">
      <polygon points="0,0 42,0 24,44 -18,44" fill="url(#emSheen)" />
    </g>

    <!-- Minimalist mail icon -->
    <rect x="13" y="11" width="22" height="22" rx="6" fill="#6366F1" fill-opacity="0.22" stroke="#818CF8" stroke-opacity="0.55" stroke-width="1" />
    <rect x="17.5" y="16.5" width="13" height="10" rx="2" fill="none" stroke="#E0E7FF" stroke-width="1.4" />
    <path d="M 18.3 17.5 L 24 22 L 29.7 17.5" fill="none" stroke="#A5B4FC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

    <text x="45" y="26.5" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">minhhy191@gmail.com</text>
  </g>
  <rect x="1" y="1" width="216" height="42" rx="21" fill="none" stroke="url(#emBorder)" stroke-width="1.2" />
</svg>
