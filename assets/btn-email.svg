<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 222 44" width="222" height="44" role="img" aria-label="Email — minhhy191@gmail.com">
  <defs>
    <style><![CDATA[
      .btn-sheen { opacity: 0; animation: btnSweep 6.8s cubic-bezier(0.4, 0, 0.2, 1) -3.4s infinite; }
      @keyframes btnSweep {
        0%   { transform: translateX(-70px); opacity: 0; }
        14%  { opacity: 1; }
        38%  { transform: translateX(270px); opacity: 0; }
        100% { transform: translateX(270px); opacity: 0; }
      }
    ]]></style>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="emBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#71717A" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.40" />
    </linearGradient>
    <linearGradient id="emSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="emClip">
      <rect x="1" y="1" width="220" height="42" rx="21" />
    </clipPath>
  </defs>

  <g clip-path="url(#emClip)">
    <rect x="0" y="0" width="222" height="44" fill="url(#emBg)" />
    <g class="btn-sheen" opacity="0">
      <polygon points="0,0 44,0 24,44 -20,44" fill="url(#emSheen)" />
    </g>

    <!-- Monochrome crisp mail icon -->
    <rect x="13" y="11" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" />
    <rect x="17.5" y="16.5" width="13" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.4" />
    <path d="M 18.3 17.5 L 24 22 L 29.7 17.5" fill="none" stroke="#D4D4D8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

    <text x="46" y="26.5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">minhhy191@gmail.com</text>
  </g>
  <rect x="1" y="1" width="220" height="42" rx="21" fill="none" stroke="url(#emBorder)" stroke-width="1.2" />
</svg>
