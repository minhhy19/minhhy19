<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 44" width="196" height="44" role="img" aria-label="LinkedIn — Minh Hy">
  <defs>
    <style><![CDATA[
      .btn-sheen { opacity: 0; animation: btnSweep 6.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes btnSweep {
        0%   { transform: translateX(-70px); opacity: 0; }
        14%  { opacity: 1; }
        38%  { transform: translateX(240px); opacity: 0; }
        100% { transform: translateX(240px); opacity: 0; }
      }
    ]]></style>
    <linearGradient id="liBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111B" />
      <stop offset="100%" stop-color="#08080D" />
    </linearGradient>
    <linearGradient id="liBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E42" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#E2E8F0" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="liSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFE4E6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="liClip">
      <rect x="1" y="1" width="194" height="42" rx="21" />
    </clipPath>
  </defs>

  <g clip-path="url(#liClip)">
    <rect x="0" y="0" width="196" height="44" fill="url(#liBg)" />
    <g class="btn-sheen" opacity="0">
      <polygon points="0,0 44,0 24,44 -20,44" fill="url(#liSheen)" />
    </g>

    <rect x="13" y="11" width="22" height="22" rx="6" fill="#0A66C2" />
    <circle cx="19.5" cy="17.5" r="1.4" fill="#FFFFFF" />
    <rect x="18.3" y="20.2" width="2.4" height="7.6" rx="0.6" fill="#FFFFFF" />
    <path d="M 22.8 20.2 L 25.1 20.2 L 25.1 21.4 C 25.7 20.5 26.6 20 27.8 20 C 29.7 20 30.6 21.2 30.6 23.3 L 30.6 27.8 L 28.2 27.8 L 28.2 23.8 C 28.2 22.6 27.7 22 26.8 22 C 25.8 22 25.2 22.7 25.2 23.8 L 25.2 27.8 L 22.8 27.8 Z" fill="#FFFFFF" />

    <text x="46" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
      <tspan fill="#F8FAFC" font-weight="600">LinkedIn</tspan>
      <tspan dx="5" fill="#475569">·</tspan>
      <tspan dx="5" fill="#FDA4AF" font-weight="500">Minh Hy</tspan>
    </text>
  </g>
  <rect x="1" y="1" width="194" height="42" rx="21" fill="none" stroke="url(#liBorder)" stroke-width="1.2" />
</svg>
